name: template-check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  template-check:
    if: github.repository == 'beedigital-gr/offers-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm run test:template
